<svg xmlns="http://www.w3.org/2000/svg" width="245" height="68" viewBox="0 0 245 68" role="img" aria-label="샘플 데이터로 바로 해 보기">
  <title>샘플 데이터로 바로 해 보기</title>
  <style id="fonts">@font-face{font-family:'Pretendard Variable';font-weight:45 920;src:url(data:font/woff2;base64,) format('woff2');}</style>
  <style>
    svg { font-synthesis: none; }
    .u { font-family: 'Archivo Variable', 'Pretendard Variable', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
  </style>
  <defs>
    <!-- 버튼 그림자: 0 1px 2px rgb(18 18 18 / .08), 0 4px 12px rgb(18 18 18 / .06) -->
    <filter id="lift" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#121212" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#121212" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="229" height="48" rx="2" fill="#e5431b" stroke="#e5431b" stroke-width="1.5" filter="url(#lift)"/>
  <!-- 재생 아이콘 (src/ui/components/Icon.tsx 의 play, 20px 격자) -->
  <path transform="translate(24 22.0)" d="M6.5 4.5v11l9-5.5z" fill="#1a0a04"/>
  <text class="u" x="52" y="37.8" font-size="16" font-weight="650" fill="#1a0a04">샘플 데이터로 바로 해 보기</text>
</svg>
